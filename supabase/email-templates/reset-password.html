<!--
  Plantilla "Reset Password" — pegar en Supabase Dashboard:
  Authentication → Emails → Reset Password

  Mismo motivo que confirm-signup.html: el link no restablece nada con
  solo abrirse, requiere el clic en /auth/confirmar.
-->
<div style="background-color:#F5F1EA;padding:40px 16px;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
    <tr>
      <td style="text-align:center;padding-bottom:24px;">
        <img src="https://www.cylcard.com/icons/icon-192.png" width="48" height="48" alt="Gestión doméstica" style="border-radius:12px;display:block;margin:0 auto 12px;">
        <span style="font-size:15px;font-weight:bold;color:#4A342A;">Gestión doméstica</span>
      </td>
    </tr>
    <tr>
      <td style="background-color:#D7C9B8;border-radius:12px;padding:32px;text-align:center;">
        <h1 style="margin:0 0 12px;font-size:20px;color:#4A342A;">Restablece tu contraseña</h1>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#7D5A44;">
          Pediste cambiar tu contraseña. Da clic en el botón para elegir una nueva.
        </p>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
          <tr>
            <td style="background-color:#7D5A44;border-radius:8px;">
              <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery&next=/restablecer" style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:bold;color:#F5F1EA;text-decoration:none;">
                Restablecer contraseña
              </a>
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0;font-size:12px;color:#7D5A44;">
          Si tú no pediste esto, puedes ignorar este correo — tu contraseña sigue igual.
        </p>
      </td>
    </tr>
  </table>
</div>
